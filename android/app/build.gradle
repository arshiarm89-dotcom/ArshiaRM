plugins {
    id 'com.android.application'
}

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'ir.arshiarm.museum'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.arshiarm.museum'
        minSdk 24
        targetSdk 35
        versionCode run
        versionName "1.0.${run}"
    }

    signingConfigs {
        museum {
            storeFile file('museum.keystore')
            storePassword 'arshiarm-museum'
            keyAlias 'museum'
            keyPassword 'arshiarm-museum'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.museum
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
