plugins {
    id 'com.android.application'
}

// Raise these only when the app itself (the android folder) changes.
// New museum content reaches phones online and does not need a new number.
def appVersionCode = 9
def appVersionName = '3.6'

android {
    namespace 'ir.arshiarm.museum'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.arshiarm.museum'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        museum {
            storeFile file('museum.keystore')
            storePassword 'arshiarm-museum'
            keyAlias 'museum'
            keyPassword 'arshiarm-museum'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.museum
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
