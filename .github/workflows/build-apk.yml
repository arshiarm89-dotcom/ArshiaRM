name: Build museum APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'online/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the museum inside the app
        run: |
          set -e
          python3 tools/make_manifest.py site
          mkdir -p android/app/src/main/assets
          cp -r site/. android/app/src/main/assets/
          ls -la android/app/src/main/assets android/app/src/main/assets/lib

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Museum-ArshiaRM.apk

      - name: Keep the APK in the apk branch
        run: |
          mkdir -p /tmp/apkbranch && cp Museum-ArshiaRM.apk /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "museum-bot"
          git config user.email "museum-bot@users.noreply.github.com"
          git add Museum-ArshiaRM.apk
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: Museum-APK
          path: Museum-ArshiaRM.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: موزه معاصر ایران (نسخه دیجیتال) - نسخه ${{ github.run_number }}
          body: فایل Museum-ArshiaRM.apk رو دانلود کن و روی گوشی اندرویدی نصب کن. نسخه‌ی ۲ به بعد، اعلان‌ها و به‌روزرسانی‌های موزه رو آنلاین می‌گیره. Created By ArshiaRM
          files: Museum-ArshiaRM.apk
